name: Wekelijkse update EU

on:
  schedule:
  - cron: '0 7 * * 1' 
workflow_dispatch: {} 

jobs:
  render:
  runs-on: ubuntu-latest
env:
  GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
steps:
  - uses: actions/checkout@v4

- uses: r-lib/actions/setup-r@v2

- uses: r-lib/actions/setup-r-dependencies@v2
with:
  packages: |
  any::flexdashboard
any::tidyRSS
any::dplyr
any::stringr
any::lubridate
any::DT
any::plotly
any::purrr
any::tidyr
any::scales
any::httr
any::jsonlite
any::xml2
any::rmarkdown

- name: Render dashboard
run: Rscript -e 'rmarkdown::render("Dashboard_def.Rmd", output_file = "index.html")'

- name: Deploy to GitHub Pages
uses: peaceiris/actions-gh-pages@v3
with:
  github_token: ${{ secrets.GITHUB_TOKEN }}
publish_dir: .
keep_files: false
